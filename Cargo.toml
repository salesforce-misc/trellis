[workspace]
resolver = "2"
members = [
    "trellis",
    "benchmark",
    "cli",
    "clients/embed",
    "clients/elixir/native/trellis_nif",
    "clients/ruby/ext/trellis_ruby",
    "generative",
    "testkit",
]
# Every member but the Ruby extension, so a command that names no package
# (`cargo clippy --all-targets --all-features`, `cargo build`) never turns on
# its `ruby` feature, whose `rb-sys` build script needs a Ruby install and
# libclang. `--workspace` still builds it, with the feature off, as an empty
# library; see clients/ruby/ext/trellis_ruby/Cargo.toml.
default-members = [
    "trellis",
    "benchmark",
    "cli",
    "clients/embed",
    "clients/elixir/native/trellis_nif",
    "generative",
    "testkit",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"

# Dependencies build with light optimisation: a slightly faster test run for
# a small clean-build cost. Workspace crates stay at opt-level 0.
[profile.dev.package."*"]
opt-level = 1
