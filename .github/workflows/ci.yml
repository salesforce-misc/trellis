name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # This repo moved from a private org with self-hosted runners (whose
    # token trust required the spiff-ubuntu-4-16 label) to the public
    # salesforce-misc org, which has no such self-hosted runner. Use the
    # standard GitHub-hosted runner instead.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Local composite action (mirrors peg) so we don't need an allowlisted
        # third-party toolchain action. Pinned to the version in
        # rust-toolchain.toml so CI and local dev never drift.
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install PostgreSQL server binaries
        # the shared test harness (see testkit/src/cluster.rs) shells out to
        # initdb/postgres/pg_isready/createdb/dropdb to spin up throwaway
        # instances for trellis's (and other crates') integration tests.
        # Prefer PostgreSQL server binaries already present on the runner (not
        # necessarily on PATH); fall back to installing the distro package.
        run: |
          set -euo pipefail
          pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$pg_bin" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin | sort -V | tail -n1)"
          fi
          echo "using PostgreSQL server binaries from: $pg_bin"
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Test
        run: cargo test --workspace --exclude generative

      - name: Test generative (fast lane)
        # generative/README.md's fast/deep split: skip every proptest
        # property (all 9 are named with a `property_` prefix precisely so
        # they can be skipped as a group, not by a hand-maintained name
        # list -- generative/tests/meta.rs enforces the prefix on every
        # `proptest!` block so a future property can't silently dodge this
        # skip), keep everything else in the crate (the lib, coverage, meta,
        # oracle, backend_seam, backfill, and every pin/regression test).
        # One property (`property_convergence_holds_for_trivial_programs`)
        # gets an in-repo nightly deep run at a much higher case count -- see
        # nightly.yml; a separate, out-of-repo nightly calibrates case counts
        # across all 9.
        run: cargo test -p generative -- --skip property_
