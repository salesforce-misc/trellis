name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI never attaches a debugger, and line tables keep file:line in panic
  # backtraces. Full debug info made the ~115 statically linked test
  # binaries ~13GB and a fifth of the build was linking them.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # How many `test` job shards there are; the matrix `shard` list below must be
  # 1..TEST_SHARDS (the `lint` job checks it).
  TEST_SHARDS: 4

jobs:
  lint:
    # Formatting, clippy and the shard-plan check (split out of the old single
    # `ci` job so it runs beside the test shards, not before them).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: toolchain
        # Local composite action (mirrors peg) so we don't need an allowlisted
        # third-party toolchain action. Pinned to the version in
        # rust-toolchain.toml so CI and local dev never drift.
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Restore Cargo dependency cache
        # Compiled third-party dependencies (see prune-cargo-target.sh), keyed
        # on everything that decides them: the compiler, the debug-info
        # setting above and Cargo.lock. A lockfile change still restores the
        # nearest older entry, so only the changed dependencies rebuild. PRs
        # restore the entry main saved. This job is the only one that saves it
        # (the `test` shards, the `elixir` job and the `ruby` job restore only).
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the test shard plan
        # Every test binary is in exactly one `test` shard, and the shard
        # matrix below matches TEST_SHARDS; see .github/scripts/test-shards.py.
        run: python3 .github/scripts/test-shards.py check

      - name: Check the CLI binary carries no test-only code
        # A dev build of the CLI, whose dependencies the cache above holds
        # (a release build would recompile everything). It holds the same
        # strings a release build does, and more of them: release.yml checks
        # every shipped binary through build-cli.sh.
        run: .github/scripts/check-release-binary.sh --profile dev

      - name: Clippy
        # `--all-features` alone makes code whose only caller is feature-gated
        # look live, so dead code and unused imports in narrower builds slip
        # through. The extra runs cover the feature sets that
        # actually get built: the production default, and trellis with
        # `test-util` but not `internals` (benchmark, generative's
        # engine_subprocess). They share the build cache with the first.
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --workspace -- -D warnings
          cargo clippy -p benchmark --features engine-access -- -D warnings
          cargo clippy -p generative --features subprocess-backend -- -D warnings

      - name: Rustdoc
        # The crate docs link only to public items and every link resolves.
        run: RUSTDOCFLAGS='-D warnings' cargo doc -p trellis --no-deps

      - name: Check the public API
        # The crate's public items are exactly .github/public-api.txt, so an
        # addition is a visible diff in review; see the script's docstring.
        run: .github/scripts/check-public-api.py

      - name: Build every test's dependencies for the cache
        # Only on a cache miss, so the saved entry holds the dependencies of
        # all the shards, not of whichever shard happened to save it.
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --features benchmark/engine-access --no-run

      - name: Prune target/ to third-party dependencies
        # A cold build is ~5.6GB, nearly all of it this workspace's own test
        # binaries, which every run rebuilds anyway. What's left is ~800MB.
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: .github/scripts/prune-cargo-target.sh

      - name: Save Cargo dependency cache
        # Only when the exact key missed: an entry's dependencies never change,
        # so most runs restore and save nothing, and the repo's 10GB cache
        # quota holds roughly one entry per lockfile.
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test:
    # The workspace tests, split across TEST_SHARDS parallel jobs. Each shard
    # builds and runs only its own test binaries, one binary at a time as
    # before; .github/scripts/test-shards.py assigns binaries to shards by the
    # seconds in .github/test-shards.txt and fails the shard if cargo built
    # anything other than its assignment. Refresh the file as
    # docs/testing-strategy.md describes.
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A safety net for a hung test or runner, not a budget: a shard takes about
    # 10 minutes, and the default would let a hang burn six hours.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Exactly 1..TEST_SHARDS; `lint` checks it.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "1.98.0"

      - name: Restore Cargo dependency cache
        # The `lint` job's entry, restore-only: that job is the one that saves.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-

      - name: Install PostgreSQL server binaries
        # the shared test harness (see testkit/src/cluster.rs) shells out to
        # initdb/postgres/pg_isready/createdb/dropdb to spin up throwaway
        # instances for trellis's (and other crates') integration tests.
        # Prefer PostgreSQL server binaries already present on the runner (not
        # necessarily on PATH); fall back to installing the distro package.
        run: |
          set -euo pipefail
          pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$pg_bin" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin | sort -V | tail -n1)"
          fi
          echo "using PostgreSQL server binaries from: $pg_bin"
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Generate a non-default locale
        # The lc_monetary pinning tests need a locale whose
        # `money` rendering differs from `C`'s; see testkit/src/locale.rs.
        # The ubuntu-24.04 image ships the `locales` package but none of the
        # locales it generates does (C.utf8 and en_US.utf8 both render
        # `$1,234.56`).
        # Ubuntu's locale-gen takes the locale as an argument (no
        # /etc/locale.gen edit), and Postgres picks it up without a restart.
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/locale-gen ]; then
            sudo apt-get update
            sudo apt-get install -y locales
          fi
          sudo locale-gen de_DE.UTF-8
          if ! locale -a | grep -ix 'de_DE\.utf-\?8' >/dev/null; then
            echo "::error::de_DE.UTF-8 was not generated; installed locales:"
            locale -a
            exit 1
          fi

      - name: Test
        # test-shards.py runs `cargo test --workspace --features
        # benchmark/engine-access --no-fail-fast` narrowed to the shard's
        # binaries; the flags are CARGO_FLAGS in the script.
        #
        # `--workspace`, generative crate included: every proptest property in
        # generative/ is `#[ignore]`d (enforced by generative/tests/meta.rs),
        # so this runs the crate's lib, coverage, meta, oracle, backend_seam,
        # backfill and pin/regression tests but never deep-runs a property at
        # PR time. Properties are opt-in with `-- --ignored`; see nightly.yml
        # and generative/README.md.
        #
        # `benchmark/engine-access` because the benchmark binary carries
        # `required-features` for it, so a plain `--workspace` skips its unit
        # tests without a word, and those are the verdict logic performance
        # work is judged by. The test build already has
        # `trellis/test-util` on through generative's self dev-dependency, so
        # naming it here adds only the benchmark crate to the build.
        # generative's `engine_subprocess` binary needs no flag: the same
        # dev-dependency satisfies its `required-features`.
        #
        # `--no-fail-fast` so one failing test binary doesn't stop the rest
        # from running, and one run shows every failure, as `verify` does
        # locally.
        #
        # The throwaway clusters run with `jit=off`. The runner's Postgres
        # (pgdg 16, built --with-llvm) may JIT-compile the large generate_series
        # and aggregate statements the data-heavy tests run; those ran ~17x
        # slower here than on a machine whose Postgres has no JIT. JIT is
        # chosen after planning, so it changes no results or plans.
        env:
          TRELLIS_TESTKIT_PG_OPTIONS: jit=off
        run: python3 .github/scripts/test-shards.py run ${{ matrix.shard }}

  ci:
    # The one required check: it passes only when every job above passed, so
    # branch protection names `ci` and never the individual shards.
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require lint and every test shard
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT"
          echo "test shards: $TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]

  elixir:
    # The Elixir binding. Its NIF crate is a
    # workspace member, so the `lint` job already formats, lints and builds it
    # (Rustler needs no Erlang install to compile); this job loads it into a
    # BEAM and runs the ExUnit suite against a `trellis-testkit` cluster.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "1.98.0"

      - name: Restore Cargo dependency cache
        # The `lint` job's entry, restore-only: that job is the one that saves.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-

      - name: Install PostgreSQL server binaries
        # trellis-testkit shells out to initdb/postgres/pg_ctl/createdb, the
        # same as the `test` shards; see that job's step.
        run: |
          set -euo pipefail
          pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$pg_bin" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin | sort -V | tail -n1)"
          fi
          echo "using PostgreSQL server binaries from: $pg_bin"
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Install Erlang/OTP and Elixir
        # The versions clients/elixir/.tool-versions pins, from Hex's builds.
        run: .github/scripts/setup-beam.sh clients/elixir/.tool-versions "$RUNNER_TEMP/beam"

      - name: Build trellis-testkit onto PATH
        # The suite's setup (test/support/test_cluster.ex) spawns it from PATH.
        run: |
          cargo build -p testkit --bin trellis-testkit
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/trellis-testkit "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Fetch Mix dependencies
        working-directory: clients/elixir
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Check Elixir formatting
        working-directory: clients/elixir
        run: mix format --check-formatted

      - name: Test
        # `mix compile` builds the NIF from source through Cargo (debug, into
        # the workspace's target/, reusing the restored dependencies): in
        # :test, Trellis.Native never downloads a released NIF, so this tests
        # the NIF this commit builds. release.yml builds the
        # precompiled ones. The
        # suite includes the cross-language parity suite
        # (test/trellis/parity_test.exs), which runs the shared
        # clients/parity/cases.json the `ruby` job runs too.
        working-directory: clients/elixir
        env:
          MIX_ENV: test
        run: |
          mix compile --warnings-as-errors
          mix test

  ruby:
    # The Ruby binding. Its extension crate is a
    # workspace member, but everything in it is behind the `ruby` feature,
    # because rb-sys needs a Ruby install to build (see its Cargo.toml): the
    # `lint` and `test` jobs only format it and build it empty. This job lints it with
    # the feature on, then builds it into a Ruby and runs the Minitest suite
    # against a `trellis-testkit` cluster.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "1.98.0"
          components: clippy

      - name: Restore Cargo dependency cache
        # The `lint` job's entry, restore-only: that job is the one that saves.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-line-tables-

      - name: Install PostgreSQL server binaries
        # trellis-testkit shells out to initdb/postgres/pg_ctl/createdb, the
        # same as the `test` shards; see that job's step.
        run: |
          set -euo pipefail
          pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$pg_bin" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            pg_bin="$(find /usr/lib/postgresql -maxdepth 2 -type d -name bin | sort -V | tail -n1)"
          fi
          echo "using PostgreSQL server binaries from: $pg_bin"
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Install Ruby
        # The version clients/ruby/.tool-versions pins, from ruby-builder's
        # builds. The token only authenticates the digest lookup.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/setup-ruby.sh clients/ruby/.tool-versions

      - name: Install libclang
        # rb-sys generates its bindings with bindgen, which loads libclang
        # when the extension builds. The runner image's LLVM toolchains may
        # or may not ship it, so install it unless one is already there.
        run: |
          set -euo pipefail
          # libclang itself, not libclang-cpp, which lacks the C API.
          if compgen -G "/usr/lib/llvm-*/lib/libclang.so*" >/dev/null ||
             compgen -G "/usr/lib/x86_64-linux-gnu/libclang-[0-9]*.so*" >/dev/null; then
            echo "libclang found"
          else
            sudo apt-get update
            sudo apt-get install -y libclang-dev
          fi

      - name: Build trellis-testkit onto PATH
        # The suite's setup (test/support/test_cluster.rb) spawns it from PATH.
        run: |
          cargo build -p testkit --bin trellis-testkit
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/trellis-testkit "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Clippy
        # rb-sys's build script finds the Ruby installed above on PATH.
        run: cargo clippy -p trellis_ruby --features ruby -- -D warnings

      - name: Install gems
        working-directory: clients/ruby
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_PATH: vendor/bundle
        run: bundle install

      - name: Test
        # `rake test` first builds the extension from source, through the
        # extconf.rb the source gem installs with (debug, into the
        # workspace's target/, reusing the restored dependencies). The
        # suite includes the cross-language parity suite
        # (test/parity_test.rb), which runs the shared
        # clients/parity/cases.json the `elixir` job runs too.
        working-directory: clients/ruby
        env:
          BUNDLE_FROZEN: "true"
          BUNDLE_PATH: vendor/bundle
        run: bundle exec rake test

      - name: Build the source gem
        # Only that trellis-pg.gemspec loads and packs, without warnings.
        # release.yml builds, installs and checks the released gems.
        working-directory: clients/ruby
        run: gem build trellis-pg.gemspec --strict
