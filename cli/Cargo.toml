[package]
name = "trellis-cli"
version = "0.1.0-gamma"
edition.workspace = true
description = "The trellis command-line tool: define streaming SQL transforms, run the pipeline and check status"
license = "Apache-2.0"
repository = "https://github.com/salesforce-misc/trellis"
readme = "../README.md"
keywords = ["postgres", "postgresql", "streaming", "materialized-view", "cli"]
categories = ["command-line-utilities", "database"]
# Ships as a release binary (docs/releasing.md), not through crates.io.
publish = false

[[bin]]
name = "trellis"
path = "src/main.rs"

[dependencies]
trellis = { path = "../trellis" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }

[dev-dependencies]
# `test-util` opens `trellis::dev::metrics`, which the metrics-endpoint test
# uses to record one observation. A dev-dependency's features stay out of
# every non-test build (resolver 2), so this never reaches the release binary
# (`.github/scripts/check-release-binary.sh` checks it).
trellis = { path = "../trellis", features = ["test-util"] }
