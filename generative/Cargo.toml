[package]
name = "generative"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Plain and featureless, deliberately. `trellis/test-util` (issue #166) is
# turned on only through this crate's own `subprocess-backend` feature
# below, never unconditionally here. Cargo unifies features across a whole
# workspace build, and this is a *normal* (not dev-) dependency, so a
# `features = ["test-util"]` written here compiles the engine's test-only
# pre-commit pause hook straight into `cli`'s production `trellis` binary on
# any plain `cargo build --workspace [--release]` — verified, not
# hypothetical. Same "must never enter a normal `cargo build`" rule the
# `proptest` dependency below already follows.
trellis = { path = "../trellis" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7.13"
# Issue #166: `backend::subprocess::SubprocessBackend` spawns/supervises the
# engine as a real child process via `testkit::crash::CrashGuard`, so this
# needs to be a normal dependency now, not (as before #166) only a
# dev-dependency every integration test pulled in separately. `testkit`
# stays dev-only scaffolding itself (see its own doc comment) — it has no
# production-facing dependents either.
testkit = { path = "../testkit" }
# proptest powers the generator's strategies and integrated shrinking, but it
# must never enter a normal `cargo build`: it's an optional dependency behind
# the `proptest` feature, and the `generative` self dev-dependency below turns
# that feature on for this crate's own tests (so `cargo test`/`clippy
# --all-targets` see the strategies) without leaking it workspace-wide.
proptest = { version = "1.11", optional = true }

[features]
proptest = ["dep:proptest"]
# ADR-0012. Turns on `trellis/test-util`, which compiles in `trellis::dev` —
# the curated, uncommitted re-export of the engine items this crate's oracle
# and backends name now that `trellis::{defs,staging,intake}` are `pub(crate)`.
# Every module in `src/lib.rs` needs it, so all five are `cfg`-gated on it and
# a plain `cargo build --workspace` compiles this crate down to an empty lib —
# which is the point: that build must not switch `trellis/test-util` on, or
# Cargo's workspace-wide feature unification compiles the engine's test-only
# hooks straight into `cli`'s production `trellis` binary. Off by default and
# turned on for this crate's own tests by the self dev-dependency below,
# exactly like `proptest`.
engine-access = ["trellis/test-util"]
# Issue #166. Turns on `trellis/test-util`, which compiles in
# `trellis::staging::apply`'s test-only pre-commit pause hook (see that
# module for the mechanism) — the thing `backend::subprocess::
# SubprocessBackend` needs in order to land a `SIGKILL` deterministically
# inside an open Phase 3 transaction. Off by default, and turned on for this
# crate's own tests by the self dev-dependency below, exactly like
# `proptest`: that is what keeps it out of `cargo build --workspace`'s
# production `cli` binary. `backend::subprocess` itself compiles either way
# (it drives the hook purely through env vars, and never names a gated
# item); only the spawned `engine_subprocess` binary actually needs the
# feature active, hence its `required-features` below.
subprocess-backend = ["engine-access", "trellis/test-util"]

# Not auto-discovered, because it must not be built by a plain
# `cargo build --workspace`: building it would activate `subprocess-backend`
# and, with it, `trellis/test-util` for every other crate in the same build.
[[bin]]
name = "engine_subprocess"
path = "src/bin/engine_subprocess.rs"
required-features = ["subprocess-backend"]

[dev-dependencies]
generative = { path = ".", features = ["engine-access", "proptest", "subprocess-backend"] }
