[package]
name = "trellis"
version = "0.1.0"
edition.workspace = true

[dependencies]
deadpool-postgres = "0.14.1"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Issue #56/ADR-0009 decision 3: the `tracing` facade every span/event in
# this crate goes through. Unconditional (unlike the four crates below) —
# emitting spans/events costs nothing when no subscriber is installed (a
# `tracing` core design goal), so this crate always compiles them in; only
# an OTLP *exporter* is feature-gated. This crate never installs a global
# subscriber itself (see `src/otel.rs`'s module doc comment) — that stays
# the embedder's job, same "library, not a binary" principle `src/metrics.rs`
# follows for the `metrics` facade.
tracing = "0.1"
# Issue #56/ADR-0009 decision 1's OTLP export layer, feature-gated behind
# `otlp` (off by default — see `src/otel.rs`). `optional = true` means none
# of these four compile at all (not just "unused") when the feature is off;
# `cargo build -p trellis --no-default-features` vs.
# `cargo build -p trellis --features otlp` both succeed, confirming this.
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry_sdk = { version = "0.32", optional = true, default-features = false, features = [
    "trace",
] }
tracing-opentelemetry = { version = "0.33", optional = true }
# `otel::layer`'s return type is `impl tracing_subscriber::Layer<S>` — needs
# the `Layer`/`LookupSpan` traits at compile time even though this crate
# never constructs or installs a `tracing_subscriber::registry()` itself
# (that stays the embedder's job — see `src/otel.rs`'s module doc comment).
# `default-features = false` (plus the explicit `registry` feature only)
# drops the `fmt`/`env-filter`/`ansi` layers this crate never uses.
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = [
    "registry",
] }
# Intake's (#7) replication transport: a pgwire-protocol logical replication
# client (START_REPLICATION + pgoutput framing). `default-features = false`
# drops the `scram`/`md5` auth and `tls-rustls` features — fine against
# testkit's trust-auth clusters and any authed production Postgres that
# only needs plain TCP/TLS-terminated-elsewhere connectivity today; SCRAM
# and rustls-TLS can be re-enabled via features (`scram`, `tls-rustls`) once
# an authed production target needs them.
pgwire-replication = { version = "0.4", default-features = false }
refinery = { version = "0.9.2", default-features = false, features = ["tokio-postgres"] }
regex = "1.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7.13"

[features]
# Issue #56/ADR-0009 decision 1's optional OTLP export layer. Off by default
# — `cargo build -p trellis` (no flags) compiles none of the four
# OTLP-related dependencies above at all, so an embedder who never enables
# this feature pays nothing, not even at compile time. See `src/otel.rs`.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
# Issue #166 and ADR-0012. Compiles in this crate's dev-only, uncommitted
# surface, which is two things:
#
#   1. A small number of test-only pause hooks (issue #166 — today, just
#      `staging::apply`'s pre-commit Phase 3 pause; see that module for the
#      mechanism) that let an external harness land a `SIGKILL` at a
#      deterministic point in the engine's drain path instead of relying on
#      timing luck.
#   2. `src/dev.rs` — ADR-0012's one sanctioned exception: a curated
#      re-export of the engine items the `generative` fuzz suite's
#      independent, evaluator-driven cross-check leg and `benchmark`'s
#      scenario oracle need. ADR-0012 makes `defs`/`staging`/`intake`
#      `pub(crate)`; `dev` is the only way across that line from another
#      crate, and nothing reached through it carries a public-API or semver
#      commitment.
#
# No dependencies, unlike `otlp` — this only gates `cfg`-attributed items,
# `src/dev.rs`, and their call sites. Off by default
# (`cfg(any(test, feature = "test-util"))` also means every `trellis` unit
# test build gets it for free, with no feature flag needed).
#
# Keeping it off for production is a property of who *enables* it, not just
# of the default, and "a plain `cargo build -p trellis` doesn't compile it
# in" is NOT enough on its own: Cargo unifies features across a whole
# workspace build, so any crate that names this feature on a **normal**
# (non-dev) `trellis` dependency also switches it on for `cli`'s production
# binary under `cargo build --workspace [--release]`. The one enabler,
# `generative` (a test-infrastructure-only crate — see its own Cargo.toml),
# therefore routes it through its own off-by-default `subprocess-backend`
# feature, activated only by its self dev-dependency. Any future enabler
# must do the same; check with
# `cargo build --workspace && strings target/debug/trellis | grep TRELLIS_TEST_PAUSE`
# (must print nothing). The same check applies to `dev`'s own contents:
# `strings target/debug/trellis | grep render_aggregate_relationship_select_sql`
# must print nothing too.
test-util = []
# ADR-0012, and *not* its sanctioned exception. `defs`/`staging`/`intake` are
# tier 3 — `pub(crate)`, named by no external crate. But this crate's own
# `tests/*.rs` are separate compilation units, so `pub(crate)` is as invisible
# to them as it is to `generative`, and they exercise the engine directly by
# design (that is what an engine integration test *is*). This feature flips
# those three modules back to `pub` for exactly that audience.
#
# It is not API, it is not a re-export an embedder may reach for, and no other
# crate in this workspace enables it: the only enabler is this crate's own
# self dev-dependency below, which means it is on for `cargo test -p trellis`
# and `cargo clippy --all-targets` and off for every other build — the same
# discipline `test-util` documents above, and subject to the same `strings`
# check. Sibling crates (`generative`, `benchmark`) go through `dev` instead;
# see `src/dev.rs`. Implies `test-util` so that engine items gated for the
# sibling crates are present here too, under one `cfg` predicate.
internals = ["test-util"]

[dev-dependencies]
testkit = { path = "../testkit" }
# Turns on `internals` (see above) for this crate's own test targets only —
# `tests/*.rs` are separate compilation units and cannot otherwise see the
# tier-3 engine modules ADR-0012 made `pub(crate)`. Exactly the self
# dev-dependency pattern `generative/Cargo.toml` uses for `proptest`/
# `subprocess-backend`, and for the same reason: it keeps the feature out of
# `cargo build --workspace`'s production `cli` binary.
trellis = { path = ".", features = ["internals"] }
# Dev-only: this crate's own tests capture spans/events emitted through
# `tracing` to assert they fire with the right fields (see
# `tests/tracing_instrumentation.rs`) — the same `tracing-subscriber`
# `Registry` + `Layer` combinator an embedder composes their own subscriber
# from (`docs/observability.md`'s "Logs and traces" section), so these tests
# exercise a realistic subscriber shape rather than a bespoke test-only
# stand-in. Never a production dependency — this crate itself never
# constructs one (see `src/otel.rs`'s module doc comment for the `otlp`
# feature's own, separate, non-dev use of `tracing-subscriber`'s `Layer`
# trait).
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
